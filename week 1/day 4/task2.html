<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Get in Touch</title>
  <link rel="icon" href="paalogo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="task2.css">
</head>
<body>

  <!-- ===== Flexbox nav bar ===== -->
  <header>
    <nav>
      <a href="index.html" class="logo">Ubaid<span>.dev</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="w1d3.html">Pricing</a></li>
        <li><a href="w1d4.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== Contact form ===== -->
  <main>
    <section class="contact">
      <h1>Get in touch</h1>
      <p class="intro">
        Fill in the form below and we'll reply within two working days.
        Fields marked with an asterisk are required.
      </p>

      <form action="/submit-contact" method="post">

        <!-- Two fields side by side, wraps on narrow screens -->
        <div class="form-row">
          <div class="form-group">
            <label for="fname">First name *</label>
            <input type="text" id="fname" name="fname" required>
          </div>
          <div class="form-group">
            <label for="lname">Last name *</label>
            <input type="text" id="lname" name="lname" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email address *</label>
            <input type="email" id="email" name="email"
                   placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="03XX-XXXXXXX">
          </div>
        </div>

        <!-- Select dropdown -->
        <div class="form-group">
          <label for="topic">What is your enquiry about? *</label>
          <select id="topic" name="topic" required>
            <option value="" disabled selected>Choose a topic</option>
            <option value="general">General question</option>
            <option value="sales">Sales &amp; pricing</option>
            <option value="support">Technical support</option>
            <option value="feedback">Feedback</option>
          </select>
        </div>

        <!-- Radio group inside a fieldset -->
        <fieldset>
          <legend>Preferred contact method</legend>
          <div class="radio-row">
            <div class="choice">
              <input type="radio" id="by-email" name="contact-method"
                     value="email" checked>
              <label for="by-email">Email</label>
            </div>
            <div class="choice">
              <input type="radio" id="by-phone" name="contact-method"
                     value="phone">
              <label for="by-phone">Phone</label>
            </div>
            <div class="choice">
              <input type="radio" id="by-either" name="contact-method"
                     value="either">
              <label for="by-either">Either is fine</label>
            </div>
          </div>
        </fieldset>

        <!-- Textarea -->
        <div class="form-group">
          <label for="message">Your message *</label>
          <textarea id="message" name="message" rows="6"
                    minlength="20" required></textarea>
          <small class="hint">Please give us at least 20 characters of detail.</small>
        </div>

        <!-- Checkbox -->
        <div class="choice consent">
          <input type="checkbox" id="consent" name="consent" value="agreed" required>
          <label for="consent">I agree to be contacted about my enquiry *</label>
        </div>

        <!-- Buttons in a flex row -->
        <div class="form-actions">
          <button type="submit" class="btn-primary">Send message</button>
          <button type="reset" class="btn-secondary">Clear form</button>
        </div>

      </form>
    </section>
  </main>

  <footer>
    <p>Built by Ubaid Khalid — Week 1, Day 4</p>
  </footer>

</body>
</html>
