<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup · professional validation</title>
  <link rel="stylesheet" href="w2d4.css">
</head>
<body>
  <main class="signup-card">
    <h1>Create account</h1>
    <p class="subhead">Join us — all fields are required</p>

    <form id="signupForm" novalidate>
      <!-- Full name -->
      <div class="field-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" placeholder="e.g. Alex Rivera" autocomplete="name">
        <span class="error-message" id="fullNameError"></span>
      </div>

      <!-- Email -->
      <div class="field-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="alex@example.com" autocomplete="email">
        <span class="error-message" id="emailError"></span>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="min 8 characters" autocomplete="new-password">
        <span class="error-message" id="passwordError"></span>
      </div>

      <!-- Confirm password -->
      <div class="field-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="re-enter password" autocomplete="off">
        <span class="error-message" id="confirmError"></span>
      </div>

      <!-- Terms (checkbox) -->
      <div class="field-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="termsCheck">
          I agree to the <a href="#" class="terms-link">terms of service</a>
        </label>
        <span class="error-message" id="termsError"></span>
      </div>

      <button type="submit" id="submitBtn">Sign up</button>

      <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
    </form>

    <p class="footnote">We respect your privacy. No spam, ever.</p>
  </main>
  <script src="w2d4.js"></script>
</body>
</html>
