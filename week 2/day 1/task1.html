<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basics</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- External JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <h1 id="heading">JavaScript Basics</h1>

    <p id="message">Learn JavaScript step by step.</p>

    <!-- Inline JavaScript -->
    <button onclick="alert('Hello from Inline JavaScript!')">
        Inline JS
    </button>

    <button onclick="showResult()">
        Run JavaScript
    </button>

    <!-- Internal JavaScript -->
    <script>
        console.log("This is Internal JavaScript");

        // Function for the second button
        function showResult() {
            alert('Hello from External JavaScript!');
            document.getElementById('message').textContent = 'JavaScript is running!';
        }
    </script>

</body>
</html>
